name: Build and deploy hosted agent

# Build -> push to JFrog (GitHub OIDC) -> Terraform apply registry connection and
# hosted-agent data-plane resource (Azure OIDC) -> REST smoke test. No stored secrets; run
# scripts/bootstrap-github-oidc.ps1 once to create the identity and repo variables.

on:
  push:
    branches: [main]
    paths:
      - app.py
      - knowledge/**
      - requirements*.txt
      - Dockerfile
      - infra/**
      - scripts/test-hosted-agent.py
      - .github/workflows/deploy-agent.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: Deploy an existing image tag instead of building (leave empty to build)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: hosted-agent-deployment
  cancel-in-progress: false

env:
  AGENT_SERVICE: private-registry-agent

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: meta
        env:
          JF_URL: ${{ vars.JF_URL }}
          JFROG_REPO: ${{ vars.JFROG_REPO }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          host="${JF_URL#https://}"
          tag="${INPUT_TAG:-sha-${GITHUB_SHA::7}}"
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "image=${host}/${JFROG_REPO}/agent:${tag}" >> "$GITHUB_OUTPUT"
          echo "build=$([ -z "${INPUT_TAG}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: JFrog login (GitHub OIDC)
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: ${{ vars.JFROG_GITHUB_OIDC_PROVIDER }}
          disable-job-summary: true
          disable-auto-build-publish: true

      - name: Docker login to JFrog
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.host }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - name: Build (linux/amd64)
        if: steps.meta.outputs.build == 'true'
        run: docker build --platform linux/amd64 -t "${{ steps.meta.outputs.image }}" .

      - name: Smoke test container
        if: steps.meta.outputs.build == 'true'
        run: |
          cid=$(docker run -d --rm -p 8088:8088 "${{ steps.meta.outputs.image }}")
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8088/readiness >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8088/readiness
          curl -fsS http://localhost:8088/liveness
          curl -fsS -X POST http://localhost:8088/responses \
            -H 'Content-Type: application/json' \
            -d '{"input":"ci smoke test"}' | tee /tmp/resp.json
          grep -q '"status":"completed"' /tmp/resp.json

      - name: Push
        if: steps.meta.outputs.build == 'true'
        run: docker push "${{ steps.meta.outputs.image }}"

      - name: Verify image exists in JFrog
        run: docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null

  deploy:
    name: Terraform agent deploy
    needs: build
    # Self-hosted runner inside the VNet: Terraform state is only reachable via private endpoint.
    runs-on: [self-hosted, linux, "${{ vars.RUNNER_LABEL }}"]
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      # Terraform azapi provider + azurerm backend authenticate with GitHub OIDC.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_foundry_account_name: ${{ vars.FOUNDRY_ACCOUNT_NAME }}
      TF_VAR_foundry_project_name: ${{ vars.FOUNDRY_PROJECT_NAME }}
      TF_VAR_connection_name: ${{ vars.REGISTRY_CONNECTION_NAME }}
      TF_VAR_registry_target: ${{ vars.JF_URL }}
      TF_VAR_token_audience: ${{ vars.REGISTRY_TOKEN_AUDIENCE }}
      TF_VAR_token_endpoint: ${{ vars.REGISTRY_TOKEN_ENDPOINT }}
      TF_VAR_oidc_provider_name: ${{ vars.REGISTRY_OIDC_PROVIDER_NAME }}
      TF_VAR_import_existing_connection: ${{ vars.REGISTRY_IMPORT_EXISTING }}
      TF_VAR_project_endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      TF_VAR_agent_name: private-registry-agent
      TF_VAR_image_uri: ${{ needs.build.outputs.image }}
      TF_VAR_registry_connection_name: ${{ vars.REGISTRY_CONNECTION_NAME }}
      TF_VAR_model_deployment_name: gpt-5-mini
      TF_VAR_import_existing_agent: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (remote state)
        working-directory: infra/registry-connection
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.RS_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.RS_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.RS_CONTAINER_NAME }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform plan
        working-directory: infra/registry-connection
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: infra/registry-connection
        run: |
          terraform apply -input=false tfplan
          rm -f tfplan

      - name: Terraform init (hosted-agent state)
        working-directory: infra/hosted-agent
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.RS_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.RS_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.RS_CONTAINER_NAME }}" \
            -backend-config="key=hosted-agent/${AZURE_ENV_NAME}.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform plan (adopt agent and create candidate version)
        working-directory: infra/hosted-agent
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply hosted agent
        working-directory: infra/hosted-agent
        run: |
          terraform apply -input=false tfplan
          rm -f tfplan

      - name: Capture candidate version
        id: agent
        working-directory: infra/hosted-agent
        run: |
          version="$(terraform output -raw agent_version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Candidate version: $version"

      - name: Wait for and smoke test candidate
        run: |
          python3 scripts/test-hosted-agent.py \
            --endpoint "$TF_VAR_project_endpoint" \
            --agent "$TF_VAR_agent_name" \
            --version "${{ steps.agent.outputs.version }}" \
            --expected-image "$TF_VAR_image_uri"
